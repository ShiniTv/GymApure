name: Load smoke (k6)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      CRON_SECRET: !!!!!!!!!!!!!!!!!!!!
      DEMO_PASSWORD: Ci-demo-pass-12!
      ALLOW_PUBLIC_REGISTER: 'true'
      PUBLIC_APP_URL: https://localhost:3000
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - name: Start server
        run: |
          npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health/live; then exit 0; fi
            sleep 1
          done
          tail -n 80 /tmp/server.log
          exit 1
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57F18C4A5E2B8C1C5A5
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Run k6 smoke
        run: k6 run -e BASE_URL=http://localhost:3000 scripts/load/smoke.js
