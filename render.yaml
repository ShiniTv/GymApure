# GymApure — Render Blueprint (Plan Gratuito / Costo CERO $0.00)
# Docs: docs/PLAN_REDUCCION_COSTOS_APK_ROLES.md
#
# Arquitectura Monolito: Un solo Web Service ejecuta API, WebSockets y Crons
# en segundo plano (PROCESS_ROLE=all). No requiere worker ni Redis de pago.
#
# Para evitar que el plan free se duerma tras 15 min de inactividad,
# agrega un monitor gratuito en https://uptimerobot.com hacia /api/health/live

services:
  - type: web
    name: caribean-gym
    runtime: node
    plan: free
    nodeVersion: 22
    buildCommand: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22.22.0'
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: '1'
      - key: PUBLIC_APP_URL
        value: https://caribean-gym.onrender.com
      - key: REQUIRE_MFA_FOR_STAFF
        value: 'false'
      - key: ENABLE_HIBP_CHECK
        value: 'true'
      - key: PROCESS_ROLE
        value: all
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_SSL_CA
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ADMIN_NOTIFY_EMAILS
        sync: false
      # Opcional: Si deseas Redis gratis en el futuro, Upstash.com ofrece 10k req/día $0
      - key: REDIS_URL
        sync: false

